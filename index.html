<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aswin Raj D — Senior Software Engineer / Jira Developer</title>
<meta name="description" content="Portfolio of Aswin Raj D, Senior Software Engineer and Jira Developer with 7+ years of experience in Java, Groovy, and Atlassian Jira/Confluence.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Ctext x='32' y='42' font-family='Arial, sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EAR%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="#top">Aswin Raj D</a>
    <nav>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#experience">Experience</a>
      <a href="#achievements">Achievements</a>
      <a href="#milestones">Milestones</a>
      <a href="#education">Education</a>
      <a href="#contact">Contact</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="icon-sun">☀️</span><span class="icon-moon">🌙</span>
      </button>
    </nav>
  </div>
</header>

<main>

  <section id="top" class="hero">
    <div class="container hero-inner" id="hero-content">
      <!-- populated by script.js from content/content.json -->
    </div>
  </section>

  <section id="about" class="section reveal">
    <div class="container">
      <h2>About</h2>
      <div class="about-inner" id="about-content">
        <!-- populated by script.js -->
      </div>
    </div>
  </section>

  <section id="skills" class="section alt reveal">
    <div class="container">
      <h2>Skills</h2>
      <div class="tech-stack-row" id="tech-stack-content">
        <!-- populated by script.js -->
      </div>
      <div class="skills-grid" id="skills-content">
        <!-- populated by script.js -->
      </div>
    </div>
  </section>

  <section id="experience" class="section reveal">
    <div class="container">
      <h2>Experience</h2>
      <div class="timeline" id="experience-content">
        <!-- populated by script.js -->
      </div>
    </div>
  </section>

  <section id="achievements" class="section alt reveal">
    <div class="container">
      <h2>Achievements</h2>
      <div class="achievements-grid" id="achievements-content">
        <!-- populated by script.js -->
      </div>
    </div>
  </section>

  <section id="milestones" class="section reveal">
    <div class="container">
      <h2>Milestones</h2>
      <div class="milestones-grid" id="milestones-content">
        <!-- populated by script.js -->
      </div>
    </div>
  </section>

  <section id="education" class="section reveal">
    <div class="container">
      <h2>Education</h2>
      <ul class="education-list" id="education-content">
        <!-- populated by script.js -->
      </ul>
    </div>
  </section>

  <section id="contact" class="section alt reveal">
    <div class="container">
      <h2>Contact</h2>
      <p id="contact-intro"></p>
      <div class="contact-grid" id="contact-content">
        <!-- populated by script.js -->
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; <span id="year"></span> Aswin Raj D. Built with care.</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
